[project]
name = "product-opportunity-finder"
version = "0.3.0"
requires-python = ">=3.12"
description = "Local-first product research and auditable opportunity analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
